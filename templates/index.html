<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <h1 class="text-center mb-4">🏋️ My Gym Tracker</h1>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Log a New Workout</h5>
                <form action="/" method="POST">
                    <div class="mb-3">
                        <label for="workout_name" class="form-label">Workout Name</label>
                        <input type="text" class="form-control" id="workout_name" name="workout_name" required placeholder="e.g., Squats">
                    </div>
                    <div class="mb-3">
                        <label for="weight" class="form-label">Weight (kg)</label>
                        <input type="number" class="form-control" id="weight" name="weight" required placeholder="e.g., 100">
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">Add Workout</button>
                </form>
            </div>
        </div>

        <h3 class="mb-3">Logged Workouts</h3>
        <ul class="list-group shadow-sm">
            {% for w in savedworkout %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span><strong>{{ w.name }}</strong> - {{ w.weight }}kg - <strong>{{w.date}}</strong></span>
                    
                    <div>
                        <a href="/update/{{ w.id }}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a href="/delete/{{ w.id }}" class="btn btn-sm btn-outline-danger">Delete</a>
                    </div>
                </li>
            {% endfor %}
            
            {% if not savedworkout %}
                <li class="list-group-item text-center text-muted">No workouts logged yet. Get to lifting!</li>
            {% endif %}
        </ul>
    </div>

</body>
</html>
