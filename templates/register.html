<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Gym Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 400px;">
        <h2 class="text-center mb-4">Create an Account</h2>
        
        <div class="card shadow-sm">
            <div class="card-body">
                
                #Error message display
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 mb-3">Sign Up</button>
                </form>
                
                <!-- Navigation Tags -->
                <div class="text-center">
                    <a href="/login" class="text-decoration-none">Already have an account? Log in</a>
                    <br>
                    <a href="/" class="text-decoration-none text-muted"><small>Return Home</small></a>
                </div>
                
            </div>
        </div>
        
    </div>

</body>
</html>
