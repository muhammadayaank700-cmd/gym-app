<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Workout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="text-center mb-4">✏️ Edit Workout</h2>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <form action="/update/{{ workout.id }}" method="POST">
                    <div class="mb-3">
                        <label for="workout_name" class="form-label">Workout Name</label>
                        <input type="text" class="form-control" id="workout_name" name="workout_name" value="{{ workout.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="weight" class="form-label">Weight (kg)</label>
                        <input type="number" class="form-control" id="weight" name="weight" value="{{ workout.weight }}" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="/" class="btn btn-outline-secondary">Cancel and go back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
