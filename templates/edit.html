{% extends "base.html" %}

{% block title %}Edit workout — Gym Tracker{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <a href="/" class="inline-flex items-center gap-2 text-sm text-base-content/60 hover:text-primary transition-colors mb-6">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to log
    </a>

    <div class="card-panel p-6 sm:p-8">
        <div class="flex items-center gap-3 mb-1">
            <span class="flex items-center justify-center w-11 h-11 rounded-xl bg-primary/15 text-primary">
                <i data-lucide="pencil" class="w-5 h-5"></i>
            </span>
            <h1 class="text-2xl font-bold tracking-tight">Edit workout</h1>
        </div>
        <p class="text-base-content/60 text-sm mt-2">Update the exercise, weight, or date for this session.</p>

        <form action="/update/{{ workout.id }}/" method="POST" class="mt-6 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-control">
                <label class="label" for="workout_name">
                    <span class="label-text font-medium">Exercise</span>
                </label>
                <input
                    type="text"
                    id="workout_name"
                    name="workout_name"
                    value="{{ workout.name }}"
                    required
                    class="input input-bordered w-full min-h-12 bg-base-100 rounded-xl"
                    placeholder="e.g. Squat"
                >
            </div>

            <div class="form-control">
                <label class="label" for="weight">
                    <span class="label-text font-medium">Weight (kg)</span>
                </label>
                <input
                    type="number"
                    id="weight"
                    name="weight"
                    value="{{ workout.weight }}"
                    min="0"
                    step="0.5"
                    required
                    class="input input-bordered w-full min-h-12 bg-base-100 rounded-xl"
                    placeholder="100"
                >
            </div>

            <div class="form-control">
                <label class="label" for="date">
                    <span class="label-text font-medium">Date</span>
                </label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ workout.date }}"
                    required
                    class="input input-bordered w-full min-h-12 bg-base-100 rounded-xl"
                >
            </div>

            <button type="submit" class="btn btn-primary w-full min-h-12 rounded-xl mt-2 gap-2">
                <i data-lucide="check" class="w-4 h-4"></i>
                Save changes
            </button>
            <a href="/" class="btn btn-outline border-base-300 w-full min-h-12 rounded-xl hover:border-primary hover:bg-primary/10">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
